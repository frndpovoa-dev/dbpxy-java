steps:
  - id: 'authenticate-docker-cli'
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - '-c'
      - |
        echo "$${DOCKERHUB_DBPXY_PASSWORD}" | docker login docker.io --username $${DOCKERHUB_DBPXY_USERNAME} --password-stdin
        echo "$${DHI_IO_PASSWORD}" | docker login dhi.io --username $${DHI_IO_USERNAME} --password-stdin
        mkdir -p /workspace/.docker
        cp ~/.docker/config.json /workspace/.docker/config.json
    secretEnv: [ 'DHI_IO_USERNAME', 'DHI_IO_PASSWORD', 'DOCKERHUB_DBPXY_USERNAME', 'DOCKERHUB_DBPXY_PASSWORD' ]
  - id: 'import-gpg-key'
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - '-c'
      - |
        echo "$${MAVEN_DBPXY_GPG_KEY}" | gpg --batch --import
    secretEnv: [ 'MAVEN_DBPXY_GPG_KEY' ]
  - id: 'build-backend-using-maven'
    name: maven:3.9-amazoncorretto-25-debian
    entrypoint: mvn
    args: [ 'clean', 'install', 'spring-boot:build-image', '-q', '-Dmaven.test.skip=true', '-Drevision=${_VERSION}', '-Dgpg.passphrase="$${MAVEN_DBPXY_GPG_PASSWORD}"' ]
    secretEnv: [ 'MAVEN_DBPXY_GPG_PASSWORD' ]
  - id: 'prepare-to-deploy-maven-artifacts'
    name: gcr.io/cloud-builders/mvn
    entrypoint: bash
    args:
      - '-c'
      - |
        LIBS="dbpxy-lib dbpxy-langchain4j-lib"
        for lib in $${LIBS}; do
          LIB_DIR=$${lib}/target/gcp-deploy/com/dbpxy/$${lib}/${_VERSION}
          mkdir -pv $${LIB_DIR}
          cp $${lib}/target/$${lib}-${_VERSION}.jar $${LIB_DIR}/$${lib}-${_VERSION}.jar
          cp $${lib}/target/$${lib}-${_VERSION}-sources.jar $${LIB_DIR}/$${lib}-${_VERSION}-sources.jar
          cp $${lib}/.flattened-pom.xml $${LIB_DIR}/$${lib}-${_VERSION}.pom
          sha1sum $${lib}/target/$${lib}-${_VERSION}.jar | awk '{print $1}' > $${LIB_DIR}/$${lib}-${_VERSION}.jar.sha1
          sha1sum $${lib}/target/$${lib}-${_VERSION}-sources.jar | awk '{print $1}' > $${LIB_DIR}/$${lib}-${_VERSION}-sources.jar.sha1
          sha1sum $${lib}/.flattened-pom.xml | awk '{print $1}' > $${LIB_DIR}/$${lib}-${_VERSION}.pom.sha1
        done
  - id: 'build-image-using-docker'
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - '-c'
      - |
        docker build --tag dbpxy:${_VERSION} --build-arg VERSION=${_VERSION} --file dbpxy-server/Dockerfile dbpxy-server
        docker tag dbpxy:${_VERSION} ${_GCP_REGION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_DOCKER_REPOSITORY}/dbpxy:${_VERSION}
        docker tag dbpxy:${_VERSION} dbpxy/dbpxy-server:${_VERSION}
    env:
      - DOCKER_BUILDKIT=1
  - id: 'push-public-maven-artifacts'
    name: maven:3.9-amazoncorretto-25-debian
    entrypoint: bash
    args:
      - '-c'
      - |
        mvn deploy -q \
          -s settings.xml \
          -Dmaven.test.skip=true \
          -Drevision=${_VERSION}
    secretEnv: [ 'MAVEN_DBPXY_USERNAME', 'MAVEN_DBPXY_PASSWORD' ]
  - id: 'push-public-docker-image'
    name: gcr.io/cloud-builders/docker
    args:
      - 'push'
      - 'dbpxy/dbpxy-server:${_VERSION}'
artifacts:
  mavenArtifacts:
    - repository: https://${_GCP_REGION}-maven.pkg.dev/${_GCP_PROJECT_ID}/${_MAVEN_REPOSITORY}
      deployFolder: dbpxy-lib/target/gcp-deploy
      groupId: com.dbpxy
      artifactId: dbpxy-lib
      version: ${_VERSION}
    - repository: https://${_GCP_REGION}-maven.pkg.dev/${_GCP_PROJECT_ID}/${_MAVEN_REPOSITORY}
      deployFolder: dbpxy-langchain4j-lib/target/gcp-deploy
      groupId: com.dbpxy
      artifactId: dbpxy-langchain4j-lib
      version: ${_VERSION}
images:
  - ${_GCP_REGION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_DOCKER_REPOSITORY}/dbpxy:${_VERSION}
availableSecrets:
  secretManager:
    - versionName: projects/${_GCP_PROJECT_ID}/secrets/DHI_IO_USERNAME/versions/1
      env: DHI_IO_USERNAME
    - versionName: projects/${_GCP_PROJECT_ID}/secrets/DHI_IO_PASSWORD/versions/1
      env: DHI_IO_PASSWORD
    - versionName: projects/${_GCP_PROJECT_ID}/secrets/DOCKERHUB_DBPXY_USERNAME/versions/2
      env: DOCKERHUB_DBPXY_USERNAME
    - versionName: projects/${_GCP_PROJECT_ID}/secrets/DOCKERHUB_DBPXY_PASSWORD/versions/2
      env: DOCKERHUB_DBPXY_PASSWORD
    - versionName: projects/${_GCP_PROJECT_ID}/secrets/MAVEN_DBPXY_GPG_KEY/versions/1
      env: MAVEN_DBPXY_GPG_KEY
    - versionName: projects/${_GCP_PROJECT_ID}/secrets/MAVEN_DBPXY_GPG_PASSWORD/versions/1
      env: MAVEN_DBPXY_GPG_PASSWORD
    - versionName: projects/${_GCP_PROJECT_ID}/secrets/MAVEN_DBPXY_USERNAME/versions/1
      env: MAVEN_DBPXY_USERNAME
    - versionName: projects/${_GCP_PROJECT_ID}/secrets/MAVEN_DBPXY_PASSWORD/versions/1
      env: MAVEN_DBPXY_PASSWORD
serviceAccount: projects/${_GCP_PROJECT_ID}/serviceAccounts/${_GCP_SVC_ACCOUNT}
options:
  logging: CLOUD_LOGGING_ONLY
